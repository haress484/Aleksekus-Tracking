        // Твоя ссылка на звук с GitHub
        const soundUrl = "https://raw.githubusercontent.com/haress484/CounterAleksekys/main/%D0%90%D0%BB%D0%B5%D0%BA%D1%81_%D0%B0%D0%BF%D1%80%D0%BE%D1%80.mp3"
        const img1 = new Image(); img1.src = photoNormal;
        const img2 = new Image(); img2.src = photoGesture;
        
        const audio = new Audio(soundUrl);
        let isGestureActive = false; 

        // Разблокировка аудио при первом клике
        document.body.addEventListener('click', () => {
            audio.play().then(() => {
                audio.pause();
                audio.currentTime = 0;
            }).catch(() => {});
        }, { once: true });

        const imgSize = 60; 
        const fingerTipIndices = [4, 8, 12, 16, 20]; 
        
        // Оставили ТОЛЬКО ОДНУ пару для проверки: 4 (Большой) и 8 (Указательный)
        const pairsToCheck = [
            [4, 8]
        ];

        function onResults(results) {
            loadingText.style.display = 'none';
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks) {
                for (const landmarks of results.multiHandLandmarks) {
                    
                    let currentlyGesturing = false;
                    let touchingFingers = new Set();

                    // Проверяем расстояние между большим и указательным пальцем
                    for (const pair of pairsToCheck) {
                        const p1 = landmarks[pair[0]];
                        const p2 = landmarks[pair[1]];

                        const dx = (p1.x - p2.x) * canvasElement.width;
                        const dy = (p1.y - p2.y) * canvasElement.height;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < 45) {
                            touchingFingers.add(pair[0]);
                            touchingFingers.add(pair[1]);
                            currentlyGesturing = true;
                        }
                    }

                    // Обновленная логика воспроизведения/остановки звука
                    if (currentlyGesturing && !isGestureActive) {
                        // Жест начался
                        isGestureActive = true;
                        audio.currentTime = 0; 
                        audio.play().catch(e => console.log("Кликните по экрану, чтобы включить звук"));
                    } else if (!currentlyGesturing && isGestureActive) {
                        // Жест закончился (пальцы разжались)
                        isGestureActive = false;
                        audio.pause();         // Останавливаем звук
                        audio.currentTime = 0; // Сбрасываем звук в начало для следующего раза
                    }

                    // Рисуем картинки
                    for (let i = 0; i < fingerTipIndices.length; i++) {
                        const tipIndex = fingerTipIndices[i];
                        const landmark = landmarks[tipIndex];

                        const x = landmark.x * canvasElement.width;
                        const y = landmark.y * canvasElement.height;

                        const currentImg = touchingFingers.has(tipIndex) ? img2 : img1;

                        if (currentImg.complete) {
                            canvasCtx.drawImage(
                                currentImg, 
                                x - imgSize / 2, 
                                y - imgSize / 2, 
                                imgSize, 
                                imgSize
                            );
                        }
                    }
                }
            }
            canvasCtx.restore();
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        
        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });
        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 640, height: 480
        });
        camera.start();
    </script>
